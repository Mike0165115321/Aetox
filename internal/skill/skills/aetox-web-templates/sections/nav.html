<!-- Nav. A real <nav> with a real list, and a menu that opens with no script:
     a checkbox is the only stateful thing on the page and it degrades to
     "always open" if CSS fails, which is the correct failure. -->
<style>
  .w-nav{ position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
          backdrop-filter:blur(10px); border-bottom:1px solid var(--line) }
  .w-nav .bar{ display:flex; align-items:center; gap:var(--gap); min-height:64px }
  .w-nav .mark{ font-weight:700; letter-spacing:-.02em; text-decoration:none; font-size:19px }
  .w-nav ul{ display:flex; gap:clamp(14px,2vw,26px); margin-left:auto; align-items:center }
  .w-nav a{ text-decoration:none; color:var(--muted); font-size:15px }
  .w-nav a:hover,.w-nav a[aria-current="page"]{ color:var(--text) }
  .w-nav .w-btn{ padding:10px 16px; font-size:15px }
  .w-nav .toggle,.w-nav .burger{ display:none }
  @media (max-width:760px){
    .w-nav .burger{ display:block; margin-left:auto; border:1px solid var(--line);
                    background:none; color:inherit; border-radius:8px; padding:8px 12px; cursor:pointer }
    .w-nav ul{ display:none; position:absolute; inset:64px 0 auto; flex-direction:column;
               align-items:stretch; gap:0; background:var(--bg); border-bottom:1px solid var(--line);
               padding:8px var(--pad) 18px }
    .w-nav ul li{ padding:10px 0; border-top:1px solid var(--line) }
    .w-nav .toggle:checked ~ ul{ display:flex }
  }
</style>

<nav class="w-nav" aria-label="หลัก">
  <div class="w-wrap bar">
    <a class="mark" href="#">แบรนด์</a>
    <input class="toggle" type="checkbox" id="nav-open" hidden>
    <label class="burger" for="nav-open">เมนู</label>
    <ul>
      <li><a href="#features">ความสามารถ</a></li>
      <li><a href="#pricing">ราคา</a></li>
      <li><a href="#faq">คำถามที่พบบ่อย</a></li>
      <li><a class="w-btn" href="#cta">เริ่มใช้งาน</a></li>
    </ul>
  </div>
</nav>
