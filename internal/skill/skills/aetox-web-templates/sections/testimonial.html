<!-- Testimonial. A real blockquote with a real cite. An unattributed quote is
     decoration; if there is no name and no role, there is no section. -->
<style>
  .w-quote figure{ max-width:34ch; margin-inline:auto; text-align:center }
  .w-quote blockquote{ font-size:clamp(21px,2.8vw,30px); line-height:1.4; letter-spacing:-.01em }
  .w-quote figcaption{ margin-top:22px; display:flex; align-items:center; justify-content:center; gap:12px }
  .w-quote img{ width:44px; height:44px; border-radius:50%; object-fit:cover }
  .w-quote cite{ font-style:normal; font-weight:600; font-size:15px }
  .w-quote .role{ color:var(--muted); font-size:14px }
</style>

<section class="w-section w-quote">
  <div class="w-wrap">
    <figure>
      <blockquote>ประโยคที่เขาพูดจริง ไม่ตัดจนเปลี่ยนความหมาย</blockquote>
      <figcaption>
        <img src="imgs/khon.jpg" alt="">
        <span><cite>ชื่อจริง</cite><br><span class="role">ตำแหน่ง ที่บริษัท</span></span>
      </figcaption>
    </figure>
  </div>
</section>
