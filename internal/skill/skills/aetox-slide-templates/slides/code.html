<!-- Code. Monospace, one screen, never scrolled. Code that does not fit is the
     wrong excerpt, not a smaller font. -->
<style>
  .l-code pre{ background:#0b0d11; border:1px solid rgba(255,255,255,.09); border-radius:14px;
               padding:26px 30px; font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
               font-size:19px; line-height:1.8; color:#e3e9ef; white-space:pre; overflow:hidden;
               margin-top:30px }
  .l-code .cm{ color:#5b6b78 }
  .l-code .hl{ background:rgba(76,141,255,.16); border-radius:4px; padding:0 4px }
  .l-code .note{ margin-top:20px; font-size:18px; color:var(--body) }
</style>

<section class="slide l-code">
  <div class="kicker rise">คำสั่ง</div>
  <h1 class="rise" style="font-size:52px">สิ่งที่ต้องพิมพ์</h1>
  <pre class="rise"><span class="cm"># สร้างคีย์</span>
ssh-keygen -t <span class="hl">ed25519</span> -C "you@example.com"</pre>
  <p class="note rise">บรรทัดที่ไฮไลต์คือส่วนที่คนมักพิมพ์ผิด</p>
</section>
