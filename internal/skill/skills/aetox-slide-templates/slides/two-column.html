<!-- Two column split. An idea and its evidence. Unequal on purpose: 50/50 reads
     as two slides that could not decide. -->
<style>
  .l-split{ display:grid; grid-template-columns:1.15fr .85fr; gap:64px; align-items:center }
  .l-split .body p{ margin-top:16px }
  .l-split .card{ background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
                  border-radius:18px; padding:30px 32px }
  .l-split .card h3{ font-size:22px; margin-bottom:10px }
  .l-split .card p{ font-size:18px; color:var(--body) }
</style>

<section class="slide l-split">
  <div class="body">
    <div class="kicker rise">บริบท</div>
    <h1 class="rise" style="font-size:62px">ข้อความหลัก</h1>
    <p class="rise">คำอธิบายที่ต่อจากหัวเรื่อง</p>
  </div>
  <div class="card rise">
    <h3>หลักฐาน</h3>
    <p>ตัวเลข คำพูด หรือรายละเอียดที่หนุนข้อความทางซ้าย</p>
  </div>
</section>
