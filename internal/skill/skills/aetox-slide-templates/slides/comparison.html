<!-- Comparison table. Three columns at most. The column you are arguing for is
     marked once, not styled loudly in every cell. -->
<style>
  .l-table table{ width:100%; border-collapse:collapse; margin-top:34px }
  .l-table th,.l-table td{ text-align:left; padding:17px 20px; font-size:19px;
                           border-bottom:1px solid rgba(255,255,255,.08) }
  .l-table th{ color:var(--muted); font-size:15px; letter-spacing:.08em; text-transform:uppercase }
  .l-table td:first-child{ color:var(--body) }
  .l-table .pick{ background:rgba(255,255,255,.04) }
  .l-table th.pick{ color:var(--accent) }
</style>

<section class="slide l-table">
  <div class="kicker rise">เทียบกัน</div>
  <h1 class="rise" style="font-size:56px">สองทางเลือก</h1>
  <table class="rise">
    <tr><th></th><th>ทางเลือก ก</th><th class="pick">ทางเลือก ข</th></tr>
    <tr><td>เกณฑ์แรก</td><td>ค่า</td><td class="pick">ค่า</td></tr>
    <tr><td>เกณฑ์ที่สอง</td><td>ค่า</td><td class="pick">ค่า</td></tr>
  </table>
</section>
