<style>

  @keyframes draw { from { stroke-dashoffset: 1000 } to { stroke-dashoffset: 0 } }
  .line { stroke-dasharray:1000; animation: draw 1.4s ease-out forwards; animation-delay: .4s; opacity:0; animation-fill-mode: forwards; }
  .line { animation: draw 1.4s ease-out .4s forwards, fadeIn .1s linear .4s forwards; }
  @keyframes fadeIn { to { opacity:1 } }
</style>
<!-- Tailwind, compiled once and written in, instead of fetched at render time.

     JIT, 282 KB over the network on every single render, and with no network the
     utility classes never apply and the frame comes out unstyled. Nothing about the
     renderer wants Tailwind; it is the template author's choice, and 16 of the 22
     scenes in this library use plain CSS and render identically.

     The block below is exactly what that script generated for THIS file, taken out
     of the page and pasted back in. Measured 31 ส.ค.: same pixels, SSIM 1.000000
     against the CDN render, 5 KB instead of 282 KB, and nothing fetched. It sits at
     the end of <head> because that is where the script used to inject it, and the
     order decides which rules win — putting it where the <script> tag was instead
     moved four gradient blobs on this page and dropped SSIM to 0.97.

     a Tailwind class that is not below will do nothing. Write plain CSS for new work. -->

<!-- The frame and the length are stated here because the renderer reads neither
     off the CSS. With no data-width/data-height on a composition root it renders
     this scene at 1080x1920, cropping a design drawn 1920 wide and saying nothing
     about it; with no data-duration, `hyperframes check` cannot sample the layout
     at all and reports the scene as having no duration. Both numbers come from a
     real render on the owner's machine, 31 ส.ค. Change them to change the aspect
     or the length; nothing else in the file has to move. -->
<body data-composition-id="scene" data-no-timeline data-width="1920" data-height="1080" data-start="0" data-duration="1.8" class="min-h-screen flex items-center justify-center p-12">

    </h1>

    <svg viewBox="0 0 1100 460" class="mt-8 w-full">
