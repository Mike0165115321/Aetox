<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Liquid Hero · Aurora Violet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&family=Source+Serif+Pro:ital,wght@1,400;1,600&display=swap" rel="stylesheet" />
<style>
  body { font-family:'Inter Tight','Noto Sans SC',system-ui,sans-serif; background:#1e1b4b; margin:0; min-height:100vh; overflow:hidden; color:#fafaf8; position:relative; }
  .blob { position:absolute; border-radius:50%; mix-blend-mode:screen; filter:blur(70px); will-change: transform; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(80px,-60px) scale(1.15) } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1.1) } 50% { transform: translate(-100px,40px) scale(0.9) } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(0.95) } 50% { transform: translate(50px,80px) scale(1.2) } }
  .b1 { width:600px; height:600px; background:#a78bfa; top:-100px; left:-100px; animation: float1 12s ease-in-out infinite; }
  .b2 { width:520px; height:520px; background:#7c5cff; top:30%; right:-100px; animation: float2 10s ease-in-out infinite; }
  .b3 { width:480px; height:480px; background:#ec4899; bottom:-100px; left:30%; animation: float3 14s ease-in-out infinite; }
  .b4 { width:380px; height:380px; background:#06b6d4; top:60%; left:10%; animation: float1 16s ease-in-out infinite; opacity:0.6 }
  .text-diff { mix-blend-mode: difference; color:#fafaf8; }
  .chip { font-family:'Inter Tight',sans-serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; }
  .serif-em { font-family:'Source Serif Pro',serif; font-style:italic; font-weight:600; }
  /* faint grid overlay */
  body::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg,rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 64px 64px; z-index:1;
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none }
  }
</style>
<!-- Tailwind, compiled once and written in, instead of fetched at render time.

     Upstream loads cdn.tailwindcss.com from the <head>: that script is the browser
     JIT, 282 KB over the network on every single render, and with no network the
     utility classes never apply and the frame comes out unstyled. Nothing about the
     renderer wants Tailwind; it is the template author's choice, and 16 of the 22
     scenes in this library use plain CSS and render identically.

     The block below is exactly what that script generated for THIS file, taken out
     of the page and pasted back in. Measured 31 ส.ค.: same pixels, SSIM 1.000000
     against the CDN render, 5 KB instead of 282 KB, and nothing fetched. It sits at
     the end of <head> because that is where the script used to inject it, and the
     order decides which rules win — putting it where the <script> tag was instead
     moved four gradient blobs on this page and dropped SSIM to 0.97.

     It is a fixed set: the utilities this scene already uses, and no others. Adding
     a Tailwind class that is not below will do nothing. Write plain CSS for new work. -->

st: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: }/* ! tailwindcss v3.4.17 | MIT License | https://tailwindcss.com */*,::after,::before{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}::after,::before{--tw-content:''}:host,html{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent}body{margin:0;line-height:inherit}hr{height:0;color:inherit;border-top-width:1px}abbr:where([title]){-webkit-text-decoration:underline dotted;text-decoration:underline dotted}h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}a{color:inherit;text-decoration:inherit}b,strong{font-weight:bolder}code,kbd,pre,samp{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-feature-settings:normal;font-variation-settings:normal;font-size:1em}small{font-size:80%}sub,sup{font-size:75%;line-height:0;position:relative;vertical-align:baseline}sub{bottom:-.25em}sup{top:-.5em}table{text-indent:0;border-color:inherit;border-collapse:collapse}button,input,optgroup,select,textarea{font-family:inherit;font-feature-settings:inherit;font-variation-settings:inherit;font-size:100%;font-weight:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;margin:0;padding:0}button,select{text-transform:none}button,input:where([type=button]),input:where([type=reset]),input:where([type=submit]){-webkit-appearance:button;background-color:transparent;background-image:none}:-moz-focusring{outline:auto}:-moz-ui-invalid{box-shadow:none}progress{vertical-align:baseline}::-webkit-inner-spin-button,::-webk </style>
</head>
<!-- Four blobs drifting on 10s, 12s, 14s and 16s loops that never line up, so
     no cut here is seamless and none needs to be: the drift is ambience behind
     a line that does not move. Six seconds is the hero line read twice, which is
     the length this library measures a title card by. Without data-duration the
     renderer refuses the scene outright ("Composition has zero duration"). -->
<body data-composition-id="scene" data-no-timeline data-width="1920" data-height="1080" data-start="0" data-duration="6"
      class="flex flex-col items-center justify-center p-16">

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <header class="absolute top-12 left-12 right-12 flex items-baseline justify-between chip opacity-70 z-10">
    <span class="text-diff">HTML ANYTHING · FRAME · LIQUID HERO</span>
    <span class="text-diff">AURORA VIOLET</span>
    <span class="text-diff">2026 · 1920 × 1080</span>
  </header>

  <main class="relative z-10 text-center max-w-[1100px]">
    <h1 class="text-diff font-black leading-[0.95] tracking-[-0.03em]" style="font-size:clamp(48px,7.5vw,128px)">
      最好的 HTML, <span class="serif-em">是</span><br/>
      让读者忘了它是 HTML。
    </h1>
    <p class="mt-8 text-diff opacity-80 text-[24px] font-medium">
      HTML Anything · 75 个世界级模板, 0 个 API key
    </p>
    <div class="mt-10 inline-flex items-center gap-3 text-[13px] font-semibold chip px-5 py-2 rounded-full text-diff" style="border:1px solid rgba(255,255,255,0.4)">
      ⌘ Try at localhost:3456
    </div>
  </main>

  <footer class="absolute bottom-12 left-12 right-12 flex items-baseline justify-between chip opacity-60 z-10">
    <span class="text-diff">FRAME-LIQUID-BG-HERO</span>
    <span class="text-diff">PREFERS-REDUCED-MOTION SAFE</span>
    <span class="text-diff">HTMLANYTHING.DEV</span>
  </footer>
</body>
</html>
