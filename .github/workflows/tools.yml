# Repackage Tesseract into a plain zip that Aetox can install without an
# administrator.
#
# Why this exists: Tesseract's only official Windows channel is the UB-Mannheim
# NSIS installer, which elevates. tesseract's own docs say there is no official
# installer for current versions and point at that build
# (https://tesseract-ocr.github.io/tessdoc/Downloads.html); the plain zips that
# turn up in a search are 3.02-era or of unclear provenance, and fixing a
# trust problem by trusting someone less is not a fix.
#
# So the bytes still come from UB-Mannheim, pinned and checksummed exactly as
# desktop/build/windows/installer/project.nsi pinned them. What changes is that
# the extraction happens once, here, in a script anyone can read, instead of by
# running a third-party installer on a stranger's machine.
#
# The output is its own release, tagged tools-tesseract-<version>, deliberately
# separate from the app's releases: the archive is immutable and changes only
# when Tesseract does, so tying it to a version number that moves every week
# would mean re-uploading identical bytes and re-pinning them for nothing.
#
# Run it from the Actions tab. It prints the manifest snippet to paste into
# internal/capability/capability.go at the end.
name: tools

on:
  workflow_dispatch:
    inputs:
      tesseract_tag:
        description: UB-Mannheim release tag
        default: v5.4.0.20240606
      tesseract_sha256:
        description: SHA256 of that release's w64 setup exe
        default: C885FFF6998E0608BA4BB8AB51436E1C6775C2BAFC2559A19B423E18678B60C9
      ffmpeg_tag:
        description: BtbN FFmpeg-Builds autobuild tag to mirror
        default: autobuild-2026-08-20-13-45
      ffmpeg_asset:
        description: the win64 LGPL shared zip in that release
        default: ffmpeg-n9.0.1-6-g9d4ca21220-win64-lgpl-shared-9.0.zip
      tessdata_commit:
        # A commit, not "main". project.nsi fetches tha.traineddata from
        # tessdata's main branch against a fixed SHA256 — so the day upstream
        # rebuilds that file, the checksum stops matching, and the installer's
        # own error path quietly skips Thai rather than failing. A pinned URL
        # cannot drift out from under its pin.
        description: tesseract-ocr/tessdata commit to take tha.traineddata from
        required: true

permissions:
  contents: write

jobs:
  tesseract:
    runs-on: windows-latest
    steps:
      - name: Download the official installer and prove it is the pinned one
        shell: pwsh
        run: |
          $tag = "${{ inputs.tesseract_tag }}"
          $url = "https://github.com/UB-Mannheim/tesseract/releases/download/$tag/tesseract-ocr-w64-setup-$($tag.TrimStart('v')).exe"
          Write-Host "fetching $url"
          curl.exe -L --fail --max-time 300 -o setup.exe $url
          $got = (Get-FileHash setup.exe -Algorithm SHA256).Hash
          if ($got -ne "${{ inputs.tesseract_sha256 }}") {
            throw "installer checksum is $got, not the pinned ${{ inputs.tesseract_sha256 }} — refusing to repackage bytes nobody reviewed"
          }
          Write-Host "checksum matches the pin"

      # 7-Zip reads NSIS archives, and it ships on the windows runner image.
      # Checked here rather than assumed: an extract that produces nothing would
      # otherwise surface three steps later as an empty zip.
      - name: Extract without running it
        shell: pwsh
        run: |
          & 7z x setup.exe -oraw -y | Out-Null
          if (-not (Test-Path raw/tesseract.exe)) {
            throw "7z did not produce tesseract.exe — the installer's layout changed"
          }
          Get-ChildItem raw | Select-Object Name, Length | Format-Table -AutoSize

      - name: Add Thai, which the official build does not carry
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/tesseract-ocr/tessdata/${{ inputs.tessdata_commit }}/tha.traineddata"
          curl.exe -L --fail --max-time 120 -o raw/tessdata/tha.traineddata $url
          if (-not (Test-Path raw/tessdata/tha.traineddata)) { throw "tha.traineddata did not download" }

      # Everything image_ocr actually reaches for, and nothing else. The
      # installer carries training tools, docs and a uninstaller that would
      # otherwise ride along into every user's data directory.
      - name: Keep only what the agent runs
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item raw/tesseract.exe out/
          Copy-Item raw/*.dll out/
          New-Item -ItemType Directory out/tessdata | Out-Null
          foreach ($f in @("eng.traineddata", "osd.traineddata", "tha.traineddata")) {
            $src = "raw/tessdata/$f"
            if (-not (Test-Path $src)) { throw "$f is missing from the extracted tree" }
            Copy-Item $src out/tessdata/
          }
          "{0:N1} MB unpacked" -f ((Get-ChildItem out -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Zip it and say what to pin
        id: pack
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath tesseract-win64.zip
          $sha = (Get-FileHash tesseract-win64.zip -Algorithm SHA256).Hash.ToLower()
          $tag = "tools-tesseract-${{ inputs.tesseract_tag }}".Replace('tools-tesseract-v', 'tools-tesseract-')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          @"

          Paste into Manifest() in internal/capability/capability.go:

            URL:    "https://github.com/${{ github.repository }}/releases/download/$tag/tesseract-win64.zip",
            SHA256: "$sha",

          "@ | Write-Host

      - name: Publish it as its own release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ steps.pack.outputs.tag }}
          body: |
            Tesseract ${{ inputs.tesseract_tag }}, repackaged from the official
            UB-Mannheim installer as a plain zip so Aetox can install it without
            an administrator. Thai language data added from tessdata
            `${{ inputs.tessdata_commit }}`.

            Not an Aetox release. Built by `.github/workflows/tools.yml`.
          files: tesseract-win64.zip

  # ffmpeg is mirrored for a different reason than Tesseract, and a sharper one.
  #
  # BtbN publishes exactly the LGPL shared build this app wants, and
  # project.nsi pinned one of their dated autobuild tags on the reasoning that
  # "the dated tag is immutable". True about its bytes, false about its
  # existence: BtbN prunes autobuilds after a few days, so on 2026-08-21 the
  # tag pinned three weeks earlier answered 404 and every fresh install of
  # v1.4.0 had been silently skipping ffmpeg — the installer's own error path
  # prints a line and carries on, so video_ocr and audio_transcribe simply were
  # not there.
  #
  # A pin can only be as durable as the thing it points at. Mirroring the zip
  # onto a release we own is what makes "immutable" true rather than hoped for.
  ffmpeg:
    runs-on: windows-latest
    steps:
      - name: Take the LGPL shared build, keep only bin/
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ inputs.ffmpeg_tag }}/${{ inputs.ffmpeg_asset }}"
          Write-Host "fetching $url"
          curl.exe -L --fail --max-time 600 -o ffmpeg.zip $url
          Expand-Archive ffmpeg.zip -DestinationPath raw
          $bin = Get-ChildItem raw -Directory | ForEach-Object { Join-Path $_.FullName 'bin' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bin) { throw 'no bin/ directory inside the archive — its layout changed' }
          if (-not (Test-Path (Join-Path $bin 'ffmpeg.exe'))) { throw 'bin/ has no ffmpeg.exe' }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "$bin/*" out/ -Recurse
          "{0:N1} MB kept" -f ((Get-ChildItem out -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Zip it and say what to pin
        id: pack
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath ffmpeg-win64-lgpl.zip
          $sha = (Get-FileHash ffmpeg-win64-lgpl.zip -Algorithm SHA256).Hash.ToLower()
          $ver = ([regex]::Match('${{ inputs.ffmpeg_asset }}', 'ffmpeg-(n[0-9][^-]*)')).Groups[1].Value
          if (-not $ver) { throw 'could not read a version out of the asset name' }
          $tag = "tools-ffmpeg-$ver"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          @"

          Paste into Manifest() in internal/capability/capability.go:

            URL:    "https://github.com/${{ github.repository }}/releases/download/$tag/ffmpeg-win64-lgpl.zip",
            SHA256: "$sha",

          "@ | Write-Host

      - name: Publish it as its own release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ steps.pack.outputs.tag }}
          body: |
            ffmpeg, LGPL shared build, mirrored from BtbN/FFmpeg-Builds
            `${{ inputs.ffmpeg_tag }}` with only `bin/` kept.

            Mirrored because BtbN prunes its autobuild tags after a few days,
            so a pin against one stops resolving. Not an Aetox release.
          files: ffmpeg-win64-lgpl.zip
