# Every push and PR. Three jobs, and the split is deliberate:
#
#   windows  the whole tree. Still the only platform where desktop/ builds, so
#            the only place `go vet ./...` and the frontend can run at all.
#   linux    cmd/ + internal/ under the race detector.
#   macos    cmd/ + internal/ plain — same code, different libc and PTY.
#
# Why the Unix jobs exist at all: until now the !windows halves of internal/proc
# were cross-compiled and never executed anywhere. tree_other.go sets Setpgid
# and cancels with kill(-pgid) — code that only a real process on a real kernel
# can prove. `go build` never even sees the _test.go files; these jobs do.
#
# The race detector lives on Linux because it needs a C compiler, which the
# owner's Windows machine does not have (verify.sh skips the stage and says so).
# That makes this runner the only place the delegate goroutine, the parked
# ask_main slot and the shared tool history are ever checked for real.
#
# All three jobs run the whole tree. desktop/ was excluded off Windows until
# phase 2 split ConPTY and WebView2 behind build tags; now every platform
# compiles and tests it, which is what catches the *_windows.go filename trap —
# context_windows.go (model token limits, nothing to do with the OS) once kept
# the CLI from building on Linux at all, and only a real non-Windows compile
# finds that class of bug.
#
# desktop/main.go does `go:embed all:frontend/dist` and dist is gitignored, so
# every job needs *something* there before `go vet ./...` will compile. Only
# Windows needs it to be the real bundle: it is the only job that runs the
# frontend tests, and the bundle is platform-independent, so building it three
# times per push bought nothing. The unix jobs write a stub instead — which also
# retired the macos failure, where `npm run build` died with Abort trap: 6
# (node's default heap against monaco's 7MB ts.worker) and took the whole job
# with it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's answer irrelevant, and `npm ci`,
# `npm run build` and the apt install carry no timeout of their own.
# Deliberately not on release.yml: cancelling a publish half-way is a much
# worse failure than paying for a superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend (required by desktop's go:embed)
        working-directory: desktop/frontend
        run: npm run build

      - run: go vet ./...

      - run: go test ./...

      - name: Frontend tests
        working-directory: desktop/frontend
        run: npm test

  unix:
    strategy:
      fail-fast: false # one OS failing must not hide the other's result
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Not needed to link anything yet — the browser host off Windows is still
      # the stub in browser_other.go. Installing it now is the cheap half of the
      # port's biggest unknown: the package split (webkit2gtk-4.0 on older
      # Ubuntu, 4.1 from 24.04 on) is exactly the kind of thing that should fail
      # in a 20-second step rather than halfway through writing
      # browser_linux.go.
      - name: GTK + WebKit dev packages (Wails' Linux backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Stub, not a build — see the header. go:embed only needs the directory
      # to exist with a file in it; nothing off Windows reads its contents.
      - name: Stub frontend dist (satisfies go:embed)
        run: |
          mkdir -p desktop/frontend/dist
          echo '<!doctype html><title>ci stub</title>' > desktop/frontend/dist/index.html

      - run: go vet ./...

      # -race subsumes a plain run, so Linux does not need both. The timeout is
      # verify.sh's: the engine parks goroutines on purpose (a sub-agent waiting
      # on ask_main), so a deadlock is a real failure mode that should report in
      # minutes rather than at the 10m default.
      - name: Test (race)
        if: runner.os == 'Linux'
        run: go test -count=1 -race -timeout 15m ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 -timeout 10m ./...
