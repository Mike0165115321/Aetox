# Windows release: push a tag like v0.4.0 and this builds the desktop app
# (NSIS installer + portable zip) and attaches it to a GitHub Release.
# ARCHITECTURE.md §23 has the release checklist.
#
# The CLI (cmd/aetox) is deliberately NOT shipped — see §30. It still builds
# and its tests still run in CI; it just is not a product yet.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tag is the one copy of the version that lives outside the repo, so
      # it is the one `go test ./internal/version` cannot check. Everything
      # else — wails.json, scoop/aetox.json, the README heading, the docs badge
      # — is checked against internal/version.Current by that test, so these
      # two lines close the loop: tag == source == every published copy.
      # Cheap, and it fails before a wrong-numbered build exists.
      - name: The tag, the source and the docs must all agree
        run: |
          go test ./internal/version/
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          $src = [regex]::Match((Get-Content internal/version/version.go -Raw), 'Current = "([^"]+)"').Groups[1].Value
          if ($src -ne $tag) { throw "tag is v$tag but internal/version.Current is $src — one of them was not bumped" }
          Write-Host "v$tag confirmed in source, wails.json, scoop, README and docs"

      - name: Install wails (pinned to go.mod) and NSIS
        run: |
          $v = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$v"
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"

      # A no-op since the step above started proving wails.json already carries
      # the tag's version. Kept as the belt to that braces: if the check is ever
      # loosened, the built exe still gets the right version resource.
      - name: Stamp version from tag into wails.json
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $cfg = Get-Content desktop/wails.json -Raw | ConvertFrom-Json
          $cfg.info.productVersion = $version
          $cfg | ConvertTo-Json -Depth 5 | Set-Content desktop/wails.json -Encoding utf8

      - name: Build desktop app + NSIS installer
        working-directory: desktop
        run: wails build -nsis -platform windows/amd64

      - name: Package portable zip + checksums
        run: |
          Compress-Archive -Path desktop/build/bin/aetox.exe -DestinationPath aetox-windows-amd64-portable.zip
          $files = @(
            "desktop/build/bin/aetox-amd64-installer.exe",
            "aetox-windows-amd64-portable.zip"
          )
          $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, (Split-Path $_ -Leaf)
          } | Set-Content checksums.txt
          Get-Content checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/build/bin/aetox-amd64-installer.exe
            aetox-windows-amd64-portable.zip
            checksums.txt
