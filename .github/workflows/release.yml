# Windows release: push a tag like v0.4.0 and this builds the desktop app
# (NSIS installer + portable zip) and attaches it to a GitHub Release.
# ARCHITECTURE.md §23 has the release checklist.
#
# The CLI (cmd/aetox) is deliberately NOT shipped — see §30. It still builds
# and its tests still run in CI; it just is not a product yet.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The tag is the one copy of the version that lives outside the repo, so
      # it is the one `go test ./internal/version` cannot check. Everything
      # else — wails.json, scoop/aetox.json, the README heading, the docs badge
      # — is checked against internal/version.Current by that test, so these
      # two lines close the loop: tag == source == every published copy.
      # Cheap, and it fails before a wrong-numbered build exists.
      - name: The tag, the source and the docs must all agree
        run: |
          go test ./internal/version/
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          $src = [regex]::Match((Get-Content internal/version/version.go -Raw), 'Current = "([^"]+)"').Groups[1].Value
          if ($src -ne $tag) { throw "tag is v$tag but internal/version.Current is $src — one of them was not bumped" }
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { throw "$notes is missing — write the release notes before tagging" }
          Write-Host "v$tag confirmed in source, wails.json, scoop, README and docs; notes at $notes"

      - name: Install wails (pinned to go.mod) and NSIS
        run: |
          $v = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$v"

          # choco can exit 0 having installed NOTHING. On 2026-08-20 the
          # community feed answered 503, choco printed "Chocolatey installed
          # 0/0 packages" and returned success; `wails build -nsis` then only
          # WARNED that makensis was missing and returned success too. The
          # first thing that actually failed was packaging, three steps later,
          # about an installer nobody had been told was never built.
          #
          # So: retry the half that is transient, then prove the tool is on
          # disk. Checking the file rather than the PATH is deliberate --
          # GITHUB_PATH only reaches the NEXT step, so `Get-Command makensis`
          # cannot see it from in here and would fail for the wrong reason.
          $nsis = "C:\Program Files (x86)\NSIS"
          foreach ($attempt in 1..3) {
            if (Test-Path "$nsis\makensis.exe") { break }
            Write-Host "installing NSIS (attempt $attempt of 3)"
            choco install nsis -y --no-progress
            if (Test-Path "$nsis\makensis.exe") { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
          }
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "NSIS did not install: $nsis\makensis.exe is missing after 3 attempts. A release without an installer is not a release."
          }
          Add-Content $env:GITHUB_PATH $nsis

      # A no-op since the step above started proving wails.json already carries
      # the tag's version. Kept as the belt to that braces: if the check is ever
      # loosened, the built exe still gets the right version resource.
      - name: Stamp version from tag into wails.json
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $cfg = Get-Content desktop/wails.json -Raw | ConvertFrom-Json
          $cfg.info.productVersion = $version
          $cfg | ConvertTo-Json -Depth 5 | Set-Content desktop/wails.json -Encoding utf8

      - name: Build desktop app + NSIS installer
        working-directory: desktop
        run: wails build -nsis -platform windows/amd64

      # The step above returns success when it built only half of what was
      # asked for, so its exit code is not the question -- both files are.
      # Asked here, one step from the cause, rather than at packaging, which
      # reports a missing path and says nothing about why it is missing.
      - name: Both artifacts exist
        run: |
          $want = @(
            "desktop/build/bin/aetox.exe",
            "desktop/build/bin/aetox-amd64-installer.exe"
          )
          $missing = @($want | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "the build did not produce: $($missing -join ', ')"
          }
          $want | ForEach-Object { "{0}  {1:N1} MB" -f $_, ((Get-Item $_).Length / 1MB) }

      # The tag check above proves the NUMBER is right; this proves the BUILD is.
      # Until now the release path ran exactly one package's tests
      # (internal/version) and had no dependency on the ci workflow — so v0.8.6
      # was published from a commit whose ci run was red. It runs here, after
      # the build, because desktop/main.go go:embeds frontend/dist and nothing
      # produces that on a fresh checkout until wails has compiled the frontend.
      # Windows is the only platform this workflow ships and the one ci covers
      # in full, so the same two commands close the gap for ~2 minutes.
      - name: The suite must pass on what is about to ship
        run: |
          go vet ./...
          go test ./...

      # The Microsoft Store build. Deliberately NOT attached to the GitHub
      # Release below: an unsigned .msix cannot be installed by anyone, because
      # the Store signs it with Microsoft's own certificate at ingestion. That
      # is also the entire reason it is worth building — a Store install is the
      # only channel that never shows a SmartScreen warning, signed or not.
      # It goes out as a workflow artifact, to be uploaded to Partner Center.
      - name: Build the Microsoft Store package
        run: |
          # Newest SDK that actually carries the tool, rather than a version
          # number pinned here that a runner image bump would silently break.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe is not on this runner — the Windows SDK is missing" }
          Write-Host "using $makeappx"

          # AppxManifest.xml ships with Version="0.0.0.0" so that it is not a
          # seventh file to bump by hand. The Store wants four parts with the
          # last one zero, so the tag's three become MAJOR.MINOR.PATCH.0.
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $manifest = "desktop/build/windows/msix/AppxManifest.xml"
          $xml = (Get-Content $manifest -Raw) -replace 'Version="0\.0\.0\.0"', "Version=`"$version.0`""
          if ($xml -notmatch [regex]::Escape("Version=`"$version.0`"")) {
            throw "the version stamp did not take — $manifest would have shipped as 0.0.0.0"
          }

          $stage = "msix-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force "$stage\Assets" | Out-Null
          Copy-Item desktop/build/bin/aetox.exe $stage
          Copy-Item desktop/build/windows/msix/Assets/*.png "$stage\Assets"
          Set-Content "$stage\AppxManifest.xml" $xml -Encoding utf8

          # The index that makes the Assets folder mean anything (DECISIONS
          # §207). Without a resources.pri, Windows ignores every qualifier in
          # those filenames and reads the one unqualified file the manifest
          # names — so the taskbar got a 44x44 PNG rescaled to 24, 30, 32, 36,
          # and the Store build wore a frayed icon the installer build never
          # had. makepri is in the same SDK bin as makeappx.
          $makepri = Join-Path (Split-Path $makeappx) "makepri.exe"
          if (-not (Test-Path $makepri)) { throw "makepri.exe is missing beside makeappx.exe" }
          & $makepri new /pr $stage /cf desktop/build/windows/msix/priconfig.xml `
            /mn "$stage\AppxManifest.xml" /of "$stage\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { throw "makepri failed with exit $LASTEXITCODE" }

          # makepri splits into resources.scale-*.pri when its config asks for
          # resource packages, and those files are for a .msixbundle nobody
          # here builds — the shipped .msix would then carry scale-100 alone.
          # priconfig.xml has no packaging node so this cannot happen; the
          # check is here because the failure is invisible until an icon looks
          # wrong on somebody's 150% display.
          $split = Get-ChildItem $stage -Filter "resources.*.pri" -ErrorAction SilentlyContinue
          if ($split) { throw "makepri split the index into $($split.Name -join ', ') — the .msix would ship scale-100 only" }
          if (-not (Test-Path "$stage\resources.pri")) { throw "no resources.pri was produced" }

          & $makeappx pack /d $stage /p aetox-windows-amd64.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit $LASTEXITCODE" }

          # makeappx has been known to report success over a package missing
          # what it was asked to carry, and the next thing to notice would be
          # Partner Center days later. Ask here instead.
          if (-not (Test-Path aetox-windows-amd64.msix)) { throw "no .msix was produced" }
          $mb = (Get-Item aetox-windows-amd64.msix).Length / 1MB
          if ($mb -lt 5) { throw "aetox-windows-amd64.msix is only $([math]::Round($mb,1)) MB — the app binary did not make it in" }

          # The taskbar's own size, named outright. It is the one asset whose
          # absence is invisible in every check above and visible on every
          # machine that installs from the Store. An .msix is a zip, and
          # reading it as one is the only way to ask what actually went in --
          # makeappx has pack and unpack and nothing that lists.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path aetox-windows-amd64.msix))
          try { $inside = $zip.Entries.FullName } finally { $zip.Dispose() }
          foreach ($needed in @(
            "resources.pri",
            "Assets/Square44x44Logo.targetsize-24_altform-unplated.png",
            "Assets/Square44x44Logo.targetsize-32.png"
          )) {
            if ($inside -notcontains $needed) { throw "the package is missing $needed" }
          }

          "aetox-windows-amd64.msix  {0:N1} MB  (v$version.0)" -f $mb

      - name: Keep the Store package for Partner Center
        uses: actions/upload-artifact@v4
        with:
          name: msix-store-package
          path: aetox-windows-amd64.msix
          if-no-files-found: error

      - name: Package portable zip + checksums
        run: |
          Compress-Archive -Path desktop/build/bin/aetox.exe -DestinationPath aetox-windows-amd64-portable.zip
          $files = @(
            "desktop/build/bin/aetox-amd64-installer.exe",
            "aetox-windows-amd64-portable.zip"
          )
          $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, (Split-Path $_ -Leaf)
          } | Set-Content checksums.txt
          Get-Content checksums.txt

      # Origin, not just integrity: the app's auto-updater verifies this
      # signature with its embedded public key (internal/update/signing.go)
      # before trusting a single hash. relsign fails the run when the secret is
      # absent — an unsigned release is one every updater silently refuses,
      # which is far worse than a red build.
      - name: Sign checksums with the release key
        env:
          AETOX_SIGNING_KEY: ${{ secrets.AETOX_SIGNING_KEY }}
        run: go run ./cmd/relsign checksums.txt

      # Release notes come from a file in the repo, reviewed in the same PR as
      # the code they describe — not typed into the GitHub web form at publish
      # time. That form is why v0.6.0, v0.8.1, v0.8.2 and v0.8.4 all shipped
      # with an empty body: writing them was a manual step after the release
      # already existed, so it was the step that got skipped.
      #
      # generate_release_notes fills in the commit list underneath, so a tag
      # pushed without its notes file still says something rather than nothing.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            desktop/build/bin/aetox-amd64-installer.exe
            aetox-windows-amd64-portable.zip
            checksums.txt
            checksums.txt.sig
